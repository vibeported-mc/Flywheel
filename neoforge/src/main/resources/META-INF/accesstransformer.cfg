# Binding a framebuffer in 26.2 goes through the OpenGL backend's FBO cache, which lives on
# GlDevice. The class itself is package-private; widening a class carries no override hazard the
# way widening a virtual method would.
public com.mojang.blaze3d.opengl.GlDevice

# Compute, which Blaze3D 26.2 has no concept of at all: no ShaderType.COMPUTE, no SSBO UniformType,
# no storage usage bit, no dispatch, no glMemoryBarrier. The draw half needs none of this --
# RenderPass.drawIndexedIndirect already exists -- so everything below serves compute only.
#
# Widening a field or a class is preferred to a mixin here: it needs no refmap and is far more
# stable across Minecraft updates than an injection. Note for whoever ports this forward: 26.3 moves
# all of these into com.mojang.renderpearl, so every line has to be re-targeted.

# Package-private classes, and so unnameable from outside com.mojang.blaze3d.opengl.
public com.mojang.blaze3d.opengl.GlCommandEncoder
public com.mojang.blaze3d.opengl.GlRenderPass

# GlCommandEncoder caches the bound program and skips _glUseProgram when it has not changed. A
# compute dispatch binds a program behind its back, so without clearing these the next draw would
# render with the compute program still current -- which looks like geometry vanishing, not an
# error. ComputePass.close() nulls them, so the invalidation cannot be forgotten by a caller.
public com.mojang.blaze3d.opengl.GlCommandEncoder lastProgram
public com.mojang.blaze3d.opengl.GlCommandEncoder lastPipeline
public com.mojang.blaze3d.opengl.GlCommandEncoder lastVertexArray

# A compute shader that has to read a texture, which is the depth pyramid occlusion culling tests
# against. The obvious alternative is to copy the texture into a buffer and read that, and it does
# not work: copyTextureToBuffer never delivers its data on 26.2 -- measured, with a shader writing a
# constant, returning byte-identical results across runs and a completion callback that never fires.
#
# So the compute pass binds the image itself, and needs the two handles Vulkan identifies it by.
# Both are private fields with no accessor.
public com.mojang.blaze3d.vulkan.VulkanGpuTextureView vkImageView
public com.mojang.blaze3d.vulkan.VulkanGpuSampler vkSampler
